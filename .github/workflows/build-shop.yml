# Положи в репозиторий как .github/workflows/build-shop.yml
# Файл сам создаёт весь проект Shop (pom.xml, plugin.yml, shop.yml, Shop.java) и собирает jar.
# Готовый jar: Actions -> последний запуск -> Artifacts -> Shop-jar
name: Build Shop

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create project files and build
        run: |
          set -e
          mkdir -p src/main/java/shop src/main/resources
          cat > pom.xml <<'EOF_SHOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>shop</groupId>
              <artifactId>Shop</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>Shop-${project.version}</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF_SHOP
          cat > src/main/resources/plugin.yml <<'EOF_SHOP'
          name: Shop
          main: shop.Shop
          version: "1.0.0"
          api: ["1.0.0"]
          author: jaryshak
          description: Системный магазин /shop на формах (покупка и продажа за монеты TpCoins)
          depend: [TpCoins]

          commands:
            shop:
              description: Открыть магазин
              usage: /shop
              permission: shop.use
            shopreload:
              description: Перезагрузить shop.yml
              usage: /shopreload
              permission: shop.reload

          permissions:
            shop.use:
              description: Пользоваться магазином
              default: "true"
            shop.reload:
              description: Перезагружать shop.yml
              default: op
          EOF_SHOP
          cat > src/main/resources/shop.yml <<'EOF_SHOP'
