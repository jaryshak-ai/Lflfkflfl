                - {id: "piston", name: "Поршень", buy: 90, sell: 30}
                - {id: "anvil", name: "Наковальня", buy: 400, sell: 130}
                - {id: "experience_bottle", name: "Бутылочка опыта", buy: 100, sell: 30}
